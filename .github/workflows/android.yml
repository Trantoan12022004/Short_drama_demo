name: Build Release APK & AAB

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & AAB on Cloud
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 3. Create local.properties
        run: |
          echo "JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID || 'f2d12b98' }}" > local.properties

      - name: 4. Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: 5. Build Release APK & AAB (for_product_)
        run: |
          ./gradlew clean
          ./gradlew assembleFor_product_Release bundleFor_product_Release --stacktrace

      - name: 6. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: app/build/outputs/apk/for_product_/release/*.apk
          retention-days: 14

      - name: 7. Upload Release AAB Artifact (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-AAB
          path: app/build/outputs/bundle/for_product_Release/*.aab
          retention-days: 14